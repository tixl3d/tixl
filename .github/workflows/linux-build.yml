name: Linux Build

# A version tag (v4.4.0.0) or a manual run builds the tarball and a Flatpak bundle from it. Both are always kept
# as workflow artifacts, and a tag also attaches them to that tag's release. Pushes to branches build nothing.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: linux-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Ubuntu 22.04's glibc (2.35) keeps everything built here portable; the prebuilt libcimgui.so from
    # ImGui.NET still raises the tarball's minimum to glibc 2.38.
    container: ubuntu:22.04
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Install Build Tools
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gcc libc6-dev git ca-certificates curl file unzip libicu70 libssl3 zlib1g python3

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds when the tag, Tixl.props and the Linux metainfo disagree (Installer/RELEASING.md)
      - name: Check Release Version
        if: github.ref_type == 'tag'
        run: python3 Installer/check-release-version.py ${{ github.ref_name }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', 'Tixl.props', 'Directory.Build.props') }}
          restore-keys: nuget-linux-

      - name: Build Native Audio Library
        run: Native/TixlAudio/build.sh

      - name: Build Tarball
        run: Installer/Linux/build-tarball.sh

      - name: Check Licences
        run: python3 Installer/check-licences.py

      - name: Upload Tarball
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tixl-linux-x64
          path: Installer/Linux/Output/*.tar.gz
          retention-days: 14

      - name: Attach Tarball to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: Installer/Linux/Output/*.tar.gz
          # Linux and macOS are previews: their releases are pre-releases and never replace the Windows release
          # GitHub shows as "Latest".
          prerelease: true
          make_latest: false

  flatpak:
    # Repackages the tarball above for testers. A Flathub build would compile from source instead.
    needs: build
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      # flatpak-builder sandboxes every build step, which needs a privileged container.
      options: --privileged
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Tarball
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tixl-linux-x64
          path: Installer/Linux/Output

      - name: Unpack Tarball
        id: unpack
        run: |
          cd Installer/Linux/Output
          tarball=$(ls tixl-*-linux-x64.tar.gz)
          tar -xzf "$tarball"
          name="${tarball%.tar.gz}"
          # The manifest reads the stage through this version-less link, as after a local build-tarball.sh.
          ln -sfn "$name" tixl-linux-x64
          version="${name#tixl-}"
          version="${version%-linux-x64}"
          echo "bundle=tixl-$version.flatpak" >> "$GITHUB_OUTPUT"

      - name: Build Flatpak Bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@79327416609af08178ad73b352877e51450790b3 # v6.8
        with:
          manifest-path: Installer/Linux/flatpak/app.tixl.TiXL.yml
          bundle: ${{ steps.unpack.outputs.bundle }}
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true
          artifact-name: tixl-flatpak

      - name: Attach Bundle to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.unpack.outputs.bundle }}
          prerelease: true
          make_latest: false
