name: Windows Build

# Preview installer for the Vulkan-based cross-platform branch. A version tag (v4.4.0.0) or a manual run builds
# it. It is always kept as a workflow artifact, and a tag also attaches it to that tag's release as a
# pre-release, so it never replaces the stable Windows release GitHub shows as "Latest".
#
# Tag builds are Authenticode-signed with Azure Artifact Signing. The IDs for that live as variables in the
# windows-signing environment, which only v* tags may use; the job signs in through OIDC, so there is no secret.
# Every other run, or a tag without the variables, builds unsigned.
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    # Only tag runs enter the environment, so a manual run on a branch builds unsigned instead of being refused.
    environment: ${{ github.ref_type == 'tag' && 'windows-signing' || '' }}
    permissions:
      contents: write
      id-token: write
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Fails in seconds when the tag, Tixl.props and the Linux metainfo disagree (Installer/RELEASING.md)
      - name: Check Release Version
        if: github.ref_type == 'tag'
        run: python Installer/check-release-version.py ${{ github.ref_name }}

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet Packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', 'Tixl.props', 'Directory.Build.props') }}
          restore-keys: nuget-windows-

      - name: Build Native Audio Library
        uses: ./.github/actions/build-audio-dll

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      # Windows PowerShell, like installer.iss does locally.
      # Also packs the optional operator packages (Settings -> Extensions) into Installer/Windows/Output/extensions;
      # on a tag their version follows the tag, which is what the editor looks for in the release.
      - name: Build Release
        shell: powershell
        run: |
          $buildArgs = @{}
          if ("${{ github.ref_type }}" -eq "tag") {
              $buildArgs.ExtensionVersion = "${{ github.ref_name }}".TrimStart("v")
          }
          Installer/Windows/build-release.ps1 @buildArgs

      - name: Check Licences
        run: python Installer/check-licences.py

      # The unit tests against this Release build. The Slang tests use the compiler the release bundles; tests
      # that need a GPU skip themselves on the runner.
      - name: Run Tests
        # Failing tests show on the run but don't hold back the installers.
        continue-on-error: true
        run: |
          $env:TIXL_SLANGC = "$PWD/Editor/bin/Release/net10.0/slang/bin/slangc.exe"
          dotnet test Core.Tests/Core.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet test VideoServices.Tests/VideoServices.Tests.csproj -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Check Signing Setup
        id: signing
        if: github.ref_type == 'tag'
        env:
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          SIGNING_ENDPOINT: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
        run: |
          $missing = @("AZURE_TENANT_ID", "AZURE_CLIENT_ID", "SIGNING_ENDPOINT", "SIGNING_ACCOUNT", "SIGNING_PROFILE") |
              Where-Object { -not [Environment]::GetEnvironmentVariable($_) }
          if ($missing) {
              Write-Output "::warning::Windows signing is not configured ($($missing -join ', ') missing); the installer is unsigned."
              "enabled=false" >> $env:GITHUB_OUTPUT
          } else {
              "enabled=true" >> $env:GITHUB_OUTPUT
          }

      - name: Azure Login
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      # Before packaging, so the installed executables name the publisher in UAC and SmartScreen too. Exports copy
      # Player.exe and only rename it, which keeps the signature, so exported players are signed as well.
      - name: Sign Executables
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files: |
            ${{ github.workspace }}\Editor\bin\Release\net10.0\TiXL.exe
            ${{ github.workspace }}\Editor\bin\Release\net10.0\Player\Player.exe
          description: TiXL
          description-url: https://tixl.app

      - name: Package Installer
        run: |
          $isccArgs = @("Installer\Windows\installer.iss", "/DSkipBuild")
          if ("${{ github.ref_type }}" -eq "tag") {
              $version = "${{ github.ref_name }}".TrimStart("v")
              $isccArgs += "/DMyAppVersion=$version"
          }
          iscc @isccArgs
          if ($LASTEXITCODE -ne 0) { throw "iscc failed" }

      # Signed after packaging, so the uninstaller Inno Setup writes stays unsigned; SmartScreen doesn't check it.
      - name: Sign Installer
        if: steps.signing.outputs.enabled == 'true'
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82 # v2.0.0
        with:
          endpoint: ${{ vars.ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.ARTIFACT_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.ARTIFACT_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\Installer\Windows\Output
          files-folder-filter: exe
          description: TiXL
          description-url: https://tixl.app

      # A signature without a timestamp stops being valid when the short-lived certificate expires (days).
      - name: Verify Signatures
        if: steps.signing.outputs.enabled == 'true'
        run: |
          $files = @(
              "Editor\bin\Release\net10.0\TiXL.exe",
              "Editor\bin\Release\net10.0\Player\Player.exe"
          ) + (Get-ChildItem "Installer\Windows\Output\*.exe").FullName
          $failed = $false
          foreach ($file in $files) {
              $signature = Get-AuthenticodeSignature $file
              Write-Output "$($signature.Status)  $($signature.SignerCertificate.Subject)  $file"
              if ($signature.Status -ne "Valid" -or -not $signature.TimeStamperCertificate) {
                  Write-Output "::error file=$file::Not validly signed and timestamped: $($signature.StatusMessage)"
                  $failed = $true
              }
          }
          if ($failed) { exit 1 }

      - name: Upload Installer
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tixl-windows-x64
          path: Installer/Windows/Output/*.exe
          retention-days: 14

      - name: Attach Installer to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: Installer/Windows/Output/*.exe
          prerelease: true
          make_latest: false

      - name: Upload Extensions
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tixl-extensions
          path: Installer/Windows/Output/extensions/*
          retention-days: 14

      - name: Attach Extensions to Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          files: Installer/Windows/Output/extensions/*
          prerelease: true
          make_latest: false
