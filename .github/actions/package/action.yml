name: "Publish"
description: "Package installer with Inno Setup"
runs:
  using: "composite"
  steps:
  - name: Install innosetup
    uses: crazy-max/ghaction-chocolatey@dfdcf5bba9c0a16358a21c13a06ec5c89024b3ac # v4.1.0
    with:
      args: install innosetup

  - name: Package Application
    shell: pwsh
    # Nightly runs have no release; they keep installer.iss's version instead of passing an empty one.
    run: |
      $tag = "${{ github.event.release.tag_name }}"
      if ($tag) { iscc Installer\Windows\installer.iss /DMyAppVersion=$($tag.TrimStart("v")) }
      else { iscc Installer\Windows\installer.iss }
      if ($LASTEXITCODE -ne 0) { throw "iscc failed" }
